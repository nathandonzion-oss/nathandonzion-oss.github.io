<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Géolocalisation</title>
<style>
    body {
        font-family: sans-serif;
        background-color: #1e1e1e;
        color: #ffffff;
        padding: 20px;
    }
    .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .card {
        background-color: #2b2b2b;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #444;
    }
    h2 {
        margin-top: 0;
        color: #4da6ff;
    }
    span {
        color: #a3e4d7;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>Données de Géolocalisation</h1>

<div class="container">
    <div class="card">
        <h2>Méthode 1 : getCurrentPosition()</h2>
        <div id="get-data">En attente des données...</div>
    </div>

    <div class="card">
        <h2>Méthode 2 : watchPosition()</h2>
        <div id="watch-data">En attente des données...</div>
    </div>
</div>

<script>
    const getDataDiv = document.getElementById('get-data');
    const watchDataDiv = document.getElementById('watch-data');

    function formatPosition(position) {
        const coords = position.coords;
        const date = new Date(position.timestamp).toLocaleString('fr-FR');
        
        let altitude = coords.altitude !== null ? coords.altitude + " mètres" : "Non disponible";
        let speed = coords.speed !== null ? coords.speed + " m/s" : "Non disponible";

        return `
            <p>Longitude : <span>${coords.longitude}</span></p>
            <p>Latitude : <span>${coords.latitude}</span></p>
            <p>Altitude : <span>${altitude}</span></p>
            <p>Précision : <span>${coords.accuracy} mètres</span></p>
            <p>Vitesse : <span>${speed}</span></p>
            <p>Date : <span>${date}</span></p>
        `;
    }

    function showError(error) {
        return `<p style="color: #ff4d4d;">Erreur : ${error.message}</p>`;
    }

    const options = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
    };

    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
            (position) => { getDataDiv.innerHTML = formatPosition(position); },
            (error) => { getDataDiv.innerHTML = showError(error); },
            options
        );

        navigator.geolocation.watchPosition(
            (position) => { watchDataDiv.innerHTML = formatPosition(position); },
            (error) => { watchDataDiv.innerHTML = showError(error); },
            options
        );
    } else {
        getDataDiv.innerHTML = "<p>La géolocalisation n'est pas supportée par votre navigateur.</p>";
        watchDataDiv.innerHTML = "<p>La géolocalisation n'est pas supportée par votre navigateur.</p>";
    }
</script>

</body>
</html>
